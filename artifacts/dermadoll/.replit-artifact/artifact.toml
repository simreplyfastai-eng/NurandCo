kind = "web"
previewPath = "/"
title = "Dermadoll Aesthetics"
version = "1.0.0"
id = "artifacts/dermadoll"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19293

[services.development]
run = "pnpm --filter @workspace/dermadoll run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dermadoll", "run", "build" ]
publicDir = "artifacts/dermadoll/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19293"
BASE_PATH = "/"
