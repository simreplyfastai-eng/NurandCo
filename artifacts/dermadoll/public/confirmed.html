<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Booking Confirmed — Starr Aesthetics</title>
<style>
:root{
  --burgundy:#5C1A1A;
  --gold:#C9A96E;
  --cream:#F5F0EB;
  --cream-dark:#ede5da;
  --text:#1a1a1a;
  --text-muted:#666;
  --border:#e0d4c4;
  --radius:10px;
  --shadow:0 2px 16px rgba(92,26,26,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--cream);color:var(--text);min-height:100vh}

.hdr{background:var(--burgundy);padding:18px 20px;text-align:center}
.hdr-logo{font-family:Georgia,serif;font-size:22px;color:var(--gold);letter-spacing:.08em;font-weight:400}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.65);letter-spacing:.15em;text-transform:uppercase;margin-top:3px}

.main{max-width:520px;margin:0 auto;padding:32px 16px 60px}

.success-icon{width:64px;height:64px;background:var(--gold);border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center}
.success-icon svg{width:32px;height:32px}

.confirmed-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:30px 24px;text-align:center;box-shadow:var(--shadow)}
.confirmed-title{font-family:Georgia,serif;font-size:26px;color:var(--burgundy);margin-bottom:8px}
.confirmed-sub{font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:24px}

.detail-table{width:100%;border-collapse:collapse;margin-bottom:20px;text-align:left}
.detail-table td{padding:10px 0;border-bottom:1px solid var(--cream-dark);font-size:13px;vertical-align:top}
.detail-table td:first-child{font-weight:600;color:var(--text-muted);width:40%;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.detail-table td:last-child{color:var(--text);font-weight:500}
.detail-table tr:last-child td{border-bottom:none}

.forms-complete{background:#f0faf0;border:1px solid #b3dab3;border-radius:8px;padding:14px 16px;font-size:13px;color:#2a6a2a;margin-bottom:20px;line-height:1.5;display:flex;align-items:center;gap:10px}
.forms-complete-icon{font-size:20px;flex-shrink:0}

.info-box{background:var(--cream);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;font-size:13px;color:var(--text-muted);line-height:1.6}
.info-box strong{color:var(--burgundy);display:block;margin-bottom:4px}

.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;border-radius:var(--radius);padding:13px 20px;font-size:14px;font-weight:600;margin-bottom:10px}
.wa-btn:hover{opacity:.92}
.wa-icon{width:20px;height:20px}

.home-btn{display:block;text-align:center;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:14px;color:var(--text-muted);text-decoration:none;font-weight:500}
.home-btn:hover{border-color:var(--burgundy);color:var(--burgundy)}

.loading-wrap{text-align:center;padding:60px 20px}
.spinner{width:32px;height:32px;border:3px solid var(--cream-dark);border-top-color:var(--burgundy);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-wrap p{color:var(--text-muted);font-size:14px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">Starr Aesthetics</div>
  <div class="hdr-sub">Booking Confirmed</div>
</div>

<div class="main" id="main-content">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <p>Loading your booking details…</p>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const BOOKING_ID = params.get('booking') || '';

function escHtml(s) {
  if (!s) return '—';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function formatDate(d) {
  if (!d) return '—';
  try {
    return new Date(d + 'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  } catch { return d; }
}

async function init() {
  const main = document.getElementById('main-content');
  if (!BOOKING_ID) {
    main.innerHTML = `<div style="text-align:center;padding:40px 0">
      <p style="color:var(--text-muted);font-size:14px">No booking reference found. Please check your confirmation email.</p>
    </div>`;
    return;
  }
  try {
    const res = await fetch('/api/forms/status?booking=' + encodeURIComponent(BOOKING_ID));
    const data = await res.json();
    const bk = data.booking || {};
    const waNum = '447535173072';
    const waMsg = encodeURIComponent('Hi, I have just booked ' + (bk.treatment || 'an appointment') + ' — I had a quick question 😊');

    main.innerHTML = `
      <div class="confirmed-card">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="confirmed-title">You're all set!</div>
        <div class="confirmed-sub">Your appointment is confirmed and your pre-appointment forms are complete. We can't wait to see you.</div>

        <table class="detail-table">
          <tr><td>Treatment</td><td>${escHtml(bk.treatment)}</td></tr>
          <tr><td>Date</td><td>${escHtml(formatDate(bk.date || bk.booking_date))}</td></tr>
          <tr><td>Time</td><td>${escHtml(bk.time || bk.time_slot)}</td></tr>
          <tr><td>Status</td><td style="color:#2D6A4F;font-weight:700">${escHtml(bk.status)}</td></tr>
        </table>

        <div class="forms-complete">
          <div class="forms-complete-icon">📋</div>
          <div>Your medical questionnaire and consent form have been received and securely stored.</div>
        </div>

        <div class="info-box">
          <strong>Before your appointment</strong>
          Please arrive 5 minutes early with clean skin, free from makeup in the treatment area. Avoid alcohol and blood-thinning medication for 24 hours beforehand unless medically required.
        </div>

        <a href="https://wa.me/${waNum}?text=${waMsg}" class="wa-btn">
          <svg class="wa-icon" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Message us on WhatsApp
        </a>
        <a href="/" class="home-btn">Return to Starr Aesthetics</a>
      </div>
    `;
  } catch(e) {
    main.innerHTML = `
      <div class="confirmed-card">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="confirmed-title">Forms Submitted!</div>
        <div class="confirmed-sub">Thank you — your pre-appointment forms have been received. We'll see you at your appointment.</div>
        <a href="/" class="home-btn" style="margin-top:20px">Return to Starr Aesthetics</a>
      </div>`;
  }
}

init();
</script>
</body>
</html>
