<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Booking Confirmed — StarrBeauty</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,Arial,sans-serif;background:#FAF7F4;color:#2C2420;min-height:100vh}

.hdr{background:#5C1E1E;padding:20px;text-align:center}
.hdr-logo{font-family:Georgia,'Times New Roman',serif;font-size:24px;color:#FFFFFF;letter-spacing:0.12em;font-weight:normal}
.hdr-sub{font-size:10px;color:#C9A96E;letter-spacing:0.28em;text-transform:uppercase;margin-top:3px}

.main{max-width:520px;margin:0 auto;padding:32px 16px 64px}

/* Animated tick */
.tick-wrap{text-align:center;padding:40px 0 20px}
@keyframes drawCircle{to{stroke-dashoffset:0}}
@keyframes drawTick{to{stroke-dashoffset:0}}
.tick-circle{
  stroke-dasharray:213;
  stroke-dashoffset:213;
  animation:drawCircle 0.65s ease forwards;
}
.tick-mark{
  stroke-dasharray:60;
  stroke-dashoffset:60;
  animation:drawTick 0.45s ease 0.55s forwards;
}

.confirmed-heading{font-family:Georgia,'Times New Roman',serif;font-size:28px;color:#5C1E1E;text-align:center;margin:0 0 8px}
.confirmed-sub{font-size:14px;color:#8C7B6B;text-align:center;margin:0 0 32px}

/* Summary card */
.summary-card{background:#FFFFFF;border:1px solid #E8DDD3;border-radius:12px;overflow:hidden;margin:0 0 24px;box-shadow:0 2px 12px rgba(92,30,30,0.06)}
.gold-bar{height:3px;background:#C9A96E}
.summary-inner{padding:24px}

.field-label{font-size:11px;color:#8C7B6B;text-transform:uppercase;letter-spacing:0.1em;margin:0 0 3px}
.field-value{font-size:15px;color:#2C2420;font-weight:600;margin:0 0 16px}
.field-value-treatment{font-family:Georgia,'Times New Roman',serif;font-size:18px;color:#5C1E1E;font-weight:normal;margin:0 0 16px}
.field-value-muted{font-size:13px;color:#8C7B6B;margin:2px 0 16px;font-weight:normal}

.gold-divider{height:1px;background:#E8DDD3;margin:16px 0}

.deposit-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.deposit-cell{padding:0}
.deposit-cell:last-child{text-align:right}
.deposit-amount{font-size:18px;color:#5C1E1E;font-weight:700}
.balance-amount{font-size:18px;color:#2C2420;font-weight:700}

/* Calendar buttons */
.cal-section{text-align:center;margin:0 0 24px}
.cal-label{font-size:11px;color:#8C7B6B;text-transform:uppercase;letter-spacing:0.1em;margin:0 0 12px}
.cal-buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cal-btn{display:inline-block;padding:11px 20px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;letter-spacing:0.06em;transition:opacity 0.2s;text-align:center}
.cal-btn:hover{opacity:0.88}
.cal-btn-google{background:#C9A96E;color:#FFFFFF}
.cal-btn-apple{background:#5C1E1E;color:#FFFFFF}
@media(max-width:360px){
  .cal-buttons{flex-direction:column}
  .cal-btn{display:block;width:100%}
}

/* Pre-appointment checklist */
.checklist-card{background:#F5EFE8;border-left:3px solid #C9A96E;border-radius:0 8px 8px 0;padding:18px 20px;margin:0 0 24px}
.checklist-label{font-size:11px;color:#C9A96E;text-transform:uppercase;letter-spacing:0.12em;margin:0 0 12px}
.check-item{font-size:13px;color:#2C2420;line-height:1.6;margin:5px 0;display:flex;align-items:baseline;gap:8px}
.check-dot{color:#C9A96E;flex-shrink:0;font-size:14px}

/* Contact card */
.contact-card{background:#FFFFFF;border:1px solid #E8DDD3;border-radius:12px;padding:24px;text-align:center;margin:0 0 24px;box-shadow:0 2px 8px rgba(92,30,30,0.04)}
.contact-heading{font-size:16px;color:#5C1E1E;font-family:Georgia,'Times New Roman',serif;margin:0 0 6px}
.contact-sub{font-size:13px;color:#8C7B6B;margin:0 0 20px}
.wa-btn{display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#FFFFFF;text-decoration:none;border-radius:8px;padding:12px 22px;font-size:14px;font-weight:600;transition:opacity 0.2s;margin:0 0 12px}
.wa-btn:hover{opacity:0.9}
.ig-link{font-size:12px;color:#C9A96E;text-decoration:none;letter-spacing:0.06em}
.ig-link:hover{text-decoration:underline}

/* Back link */
.back-link{text-align:center;margin:0 0 16px}
.back-link a{font-size:13px;color:#C9A96E;text-decoration:none}
.back-link a:hover{text-decoration:underline}

/* Loading */
.loading-wrap{text-align:center;padding:80px 20px}
.spinner{width:36px;height:36px;border:3px solid #E8DDD3;border-top-color:#5C1E1E;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#8C7B6B;font-size:14px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">STARR</div>
  <div class="hdr-sub">Aesthetics</div>
</div>

<div class="main" id="page-root">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <p class="loading-text">Loading your booking…</p>
  </div>
</div>

<script>
const BOOKING_ID = new URLSearchParams(location.search).get('booking') || '';

function esc(s) {
  if (s == null || s === '') return '—';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatDate(d) {
  if (!d) return '—';
  try {
    return new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', {
      weekday:'long', day:'numeric', month:'long', year:'numeric',
      timeZone:'Europe/London'
    });
  } catch { return d; }
}

function buildGoogleCalUrl(bk, locAddr) {
  const ts = (bk.time_slot || '09:00').slice(0,5);
  const [h,m] = ts.split(':').map(Number);
  const dur = Number(bk.duration_minutes || 60);
  const endMin = h*60 + m + dur;
  const eh = Math.floor(endMin/60)%24, em = endMin%60;
  const pad = n => String(n).padStart(2,'0');
  const d = (bk.booking_date||'').replace(/-/g,'');
  const start = `${d}T${pad(h)}${pad(m)}00`;
  const end   = `${d}T${pad(eh)}${pad(em)}00`;
  const title = encodeURIComponent((bk.treatment_name||bk.treatment||'Appointment') + ' @ StarrBeauty');
  const details = encodeURIComponent('StarrBeauty appointment\nContact: wa.me/447701298985');
  const loc = encodeURIComponent(locAddr || 'StarrBeauty');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${details}&location=${loc}`;
}

async function init() {
  const root = document.getElementById('page-root');
  if (!BOOKING_ID) {
    root.innerHTML = `<p style="text-align:center;color:#8C7B6B;padding:60px 20px">No booking reference found.<br>Please check your confirmation email.</p>`;
    return;
  }

  let bk = {}, locName = 'StarrBeauty', locAddr = 'StarrBeauty Clinic';
  try {
    const res = await fetch('/api/forms/status?booking=' + encodeURIComponent(BOOKING_ID));
    const data = await res.json();
    bk = data.booking || {};
    // Try to get location details
    if (bk.location_id) {
      try {
        const lRes = await fetch('/api/locations');
        if (lRes.ok) {
          const locs = await lRes.json();
          const found = (Array.isArray(locs) ? locs : locs.locations || [])
            .find(l => l.id === bk.location_id);
          if (found) {
            locName = found.name || locName;
            locAddr = found.address || found.address_full || locAddr;
          }
        }
      } catch (_) {}
    }
  } catch(_) {
    // Fallback if fetch fails
    bk = {};
  }

  const treatment = bk.treatment_name || bk.treatment || 'Your appointment';
  const dateStr   = formatDate(bk.booking_date || bk.date);
  const timeStr   = (bk.time_slot || bk.time || '').slice(0,5) || '—';
  const deposit   = Number(bk.deposit_amount || 0);
  const total     = Number(bk.total_amount || bk.total_price || 0);
  const balance   = Math.max(0, total - deposit);
  const clientName = (bk.client_name || '').split(' ')[0] || '';
  const googleUrl = buildGoogleCalUrl(bk, locAddr);
  const icsUrl    = `/api/calendar/ics?booking=${encodeURIComponent(BOOKING_ID)}`;

  root.innerHTML = `
    <div class="tick-wrap">
      <svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true">
        <circle class="tick-circle" cx="40" cy="40" r="34"
          fill="none" stroke="#C9A96E" stroke-width="2.5"/>
        <polyline class="tick-mark" points="23,40 34,52 57,27"
          fill="none" stroke="#5C1E1E" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="confirmed-heading">You're all booked in ✨</h1>
    ${clientName ? `<p class="confirmed-sub">See you soon, ${esc(clientName)}</p>` : '<p class="confirmed-sub">Your forms have been received. See you soon!</p>'}
    <p style="font-size:12px;color:#B5A89A;text-align:center;margin:-20px 0 28px;">Please check your spam folder if you don't see a confirmation email in your inbox.</p>

    <div class="summary-card">
      <div class="gold-bar"></div>
      <div class="summary-inner">
        <p class="field-label">Treatment</p>
        <p class="field-value-treatment">${esc(treatment)}</p>

        <p class="field-label">Date &amp; Time</p>
        <p class="field-value">${esc(dateStr)} at ${esc(timeStr)}</p>

        <p class="field-label">Location</p>
        <p class="field-value" style="margin-bottom:4px">${esc(locName)}</p>
        <p class="field-value-muted">${esc(locAddr)}</p>

        <div class="gold-divider"></div>

        <div class="deposit-grid">
          <div class="deposit-cell">
            <p class="field-label">Deposit Paid</p>
            <p class="deposit-amount">£${deposit}</p>
          </div>
          <div class="deposit-cell">
            <p class="field-label">Balance Due on Day</p>
            <p class="balance-amount">£${balance}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="cal-section">
      <p class="cal-label">Add to your calendar</p>
      <div class="cal-buttons">
        <a href="${googleUrl}" target="_blank" rel="noopener" class="cal-btn cal-btn-google">+ GOOGLE CALENDAR</a>
        <a href="${icsUrl}" class="cal-btn cal-btn-apple">+ APPLE / OTHER</a>
      </div>
    </div>

    <div class="checklist-card">
      <p class="checklist-label">Before your appointment</p>
      <div class="check-item"><span class="check-dot">✦</span><span>Arrive 5 minutes early</span></div>
      <div class="check-item"><span class="check-dot">✦</span><span>Clean face — no makeup on treatment area</span></div>
      <div class="check-item"><span class="check-dot">✦</span><span>Avoid alcohol 24 hours before</span></div>
      <div class="check-item"><span class="check-dot">✦</span><span>No blood thinners 24hrs before injectables</span></div>
      <div class="check-item"><span class="check-dot">✦</span><span>Contact us if any medical details change</span></div>
    </div>

    <div class="contact-card">
      <p class="contact-heading">Questions? We're here.</p>
      <p class="contact-sub">Our team is happy to help with anything before your visit.</p>
      <a href="https://wa.me/447701298985?text=${encodeURIComponent('Hi, I have a question about my upcoming appointment at StarrBeauty 😊')}"
        class="wa-btn" target="_blank" rel="noopener">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        WHATSAPP US
      </a>
      <br>
      <a href="https://instagram.com/StarrAestheticss" target="_blank" rel="noopener" class="ig-link">@StarrAestheticss</a>
    </div>

    <div class="back-link">
      <a href="/">&larr; Back to StarrBeauty</a>
    </div>
  `;
}

init();
</script>
</body>
</html>
